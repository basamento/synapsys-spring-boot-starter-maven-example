spring:
  application:
    name: spring-boot-maven-user-1
server:
  port: 8081
synapsys:
  core-url: http://localhost:8080
  core-token: syn_replace_with_a_worker_token
  # Duration syntax (5s, 500ms, 1m). The old "heartbeat-interval-ms" key bound to
  # nothing and was silently ignored.
  heartbeat-interval: 5s
  # Falls back to spring.application.name when omitted. The old key was
  # "application-name", which the starter never read.
  worker-name: spring-boot-maven-user-1

  # How long shutdown waits for running processes to become terminal before it
  # reports them and finishes. SlowStopperProcess and UncancellableBatchProcess
  # outlast a short budget on purpose, which is what the warning is for: the
  # starter never kills a thread it does not own.
  shutdown-timeout: 10s

  # Set false to keep remote start/stop while leaving System.out and System.err
  # untouched. Process output then stays local instead of being streamed to Core.
  capture-console: true
